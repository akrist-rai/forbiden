                            <div className="grp-stat-row"><span className="grp-stat-label">OPEN TABS</span><span className="grp-stat-val" style={{color: nodeAccent}}>{openTabs.length}</span></div>
                          </div>
                        </div>

                        {/* Main code editor */}
                        <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden', minWidth:0}}>
                          <CodeEditor
                            node={activeTabNode}
                            externalPalette={globalEditorPalette}
                            onRun={token ? runNode : null}
                            execOutput={nodeOutputs[activeTabNode.id] || ''}
                            execStatus={nodeExecStatus[activeTabNode.id] || 'idle'}
                            ydoc={ydocRef.current}
                            awareness={awarenessRef.current}
                            onChange={code => {
                              const node = nodesRef.current.find(n => n.id === activeTabNode.id);
                              if (node) { node.code = code; node.modified = true; forceRender({}); }
                              // Clear exec status on edit
                              setNodeExecStatus(s => ({...s, [activeTabNode.id]: 'idle'}));
                              // Debounced emit to backend
                              if (activeTabNode._editTimer) clearTimeout(activeTabNode._editTimer);
                              activeTabNode._editTimer = setTimeout(() => {
                                emitNodeEvent('NODE_EDITED', { nodeId: activeTabNode.id, code, language: activeTabNode.language || 'python' });
                              }, 800);
                            }}
                          />
                        </div>

                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* ── GROUP CLASS EDITOR MODAL ── */}
            {openGroup && (
              <GroupEditor
                group={openGroup}
                nodes={nodesRef.current}
                onClose={closeGroupEditor}
                onOpenNode={(id) => { closeGroupEditor(); openNodeInEditor(id); }}
              />
            )}

          </div>
        </div>
      );
    }

    function IDEWithCmd({ initialTheme, initialAvatar, token, operatorId, operatorName, workspaceId, workspaceName, onLogout }) {
      const [showCmd, setShowCmd] = useState(false);
      useEffect(() => { const h = (e) => { if((e.metaKey||e.ctrlKey)&&e.key==='p'){e.preventDefault();setShowCmd(v=>!v);} if(e.key==='Escape')setShowCmd(false); }; window.addEventListener('keydown',h); return()=>window.removeEventListener('keydown',h); },[]);
      return (
        <>
          <IDE initialTheme={initialTheme} initialAvatar={initialAvatar}
            token={token} operatorId={operatorId} operatorName={operatorName}
            workspaceId={workspaceId} workspaceName={workspaceName} onLogout={onLogout}/>
          <CommandPalette isOpen={showCmd} onClose={()=>setShowCmd(false)} onAction={()=>{}}/>
        </>
      );
    }

          .catch(() => { setLoading(false); setError('Could not load workspaces'); });

      const createWorkspace = async () => {
        if (!newName.trim()) return;
        setCreating(true);
        try {
          const result = await apiFetch('/api/workspaces', { method:'POST', body: JSON.stringify({ name: newName.trim() }) }, token);
          onSelect(result.workspaceId, result.name || newName.trim());

      return (

              <div style={{fontSize:'11px',opacity:0.3,letterSpacing:'2px'}}>FORBIDDEN</div>

            {loading ? (
              <div style={{textAlign:'center',opacity:0.3,fontSize:'11px',letterSpacing:'2px'}}>LOADING...</div>

              <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
                {workspaces.length === 0 && !error && (
                  <div style={{textAlign:'center',opacity:0.25,fontSize:'10px',letterSpacing:'1px',padding:'12px 0'}}>No workspaces yet — create one below</div>
                )}
                {workspaces.map(ws => (
                  <div key={ws.workspaceId || ws._id} onClick={() => onSelect(ws.workspaceId || ws._id, ws.name)}
                    style={{padding:'14px 18px',border:'1px solid rgba(255,255,255,0.08)',borderRadius:'6px',cursor:'pointer',background:'rgba(255,255,255,0.02)',transition:'all 0.15s',display:'flex',alignItems:'center',gap:'12px'}}
                    onMouseEnter={e=>{ e.currentTarget.style.borderColor='rgba(16,185,129,0.3)'; e.currentTarget.style.background='rgba(16,185,129,0.04)'; }}
                    onMouseLeave={e=>{ e.currentTarget.style.borderColor='rgba(255,255,255,0.08)'; e.currentTarget.style.background='rgba(255,255,255,0.02)'; }}>
                    <span style={{fontSize:'18px',opacity:0.6}}>⬡</span>
                    <div>
                      <div style={{fontSize:'12px',fontWeight:600,letterSpacing:'1px'}}>{ws.name}</div>
                      <div style={{fontSize:'9px',opacity:0.3,letterSpacing:'0.5px',marginTop:'2px',fontFamily:"'JetBrains Mono',monospace"}}>{ws.workspaceId || ws._id}</div>
                    </div>
                    <span style={{marginLeft:'auto',fontSize:'11px',opacity:0.25}}>→</span>
                  </div>
                ))}
              </div>
            )}

            <div style={{borderTop:'1px solid rgba(255,255,255,0.06)',paddingTop:'16px'}}>
              <div style={{fontSize:'9px',opacity:0.3,letterSpacing:'2px',marginBottom:'10px'}}>CREATE NEW WORKSPACE</div>
              <div style={{display:'flex',gap:'8px'}}>
                <input
                  className="login-input"
                  placeholder="workspace name..."
                  value={newName}
                  onChange={e=>setNewName(e.target.value)}
                  onKeyDown={e=>e.key==='Enter'&&createWorkspace()}
                  style={{flex:1}}
                />
                <button className="theme-btn cyber" disabled={!newName.trim()||creating} onClick={createWorkspace}
                  style={{padding:'10px 18px',fontSize:'11px',letterSpacing:'1px',minWidth:'unset'}}>
                  {creating ? '...' : 'CREATE'}
                </button>
              </div>
              {error && <div style={{color:'#ff435a',fontSize:'10px',marginTop:'8px',opacity:0.8}}>{error}</div>}
            </div>
          </div>
        </div>
      );
    }

    // ── Main bootloader with real auth ────────────────────────────────────────
    // ── 3D GRAPH CANVAS ──────────────────────────────────────────────────────
    function Graph3D({ nodesRef, edgesRef, groupsRef, nodeExecStatus, peers,
      hoveredNodeId, setHoveredNodeId, edgeMode, joinFirstNode,
      hoveredEdgeId, setHoveredEdgeId,
      openNodeInEditor, handleNodeClickInMode, handleEdgeClickInMode,
      setNodeColorPicker, runNode, activeTabId,
      socketRef, workspaceId, operatorId, sessionIdRef, AVATAR_ACCENTS,
      showCreateNode, setShowCreateNode,
    }) {
      const mountRef = useRef(null);
      const T3 = useRef({}); // {scene, cam, renderer}
      const nodeMeshMap = useRef({}); // nodeId -> {group, sphere, halo}
      const edgeLineMap = useRef({});  // edgeId -> THREE.Line
      const labelRefs = useRef({});    // nodeId -> DOM element
      const labelContainerRef = useRef(null);
      const timeLabelRefs = useRef({}); // dateStr -> DOM element
      const timeLabelContainerRef = useRef(null);
      const orbit = useRef({ theta: 0.55, phi: 1.05, radius: 820, tx: 0, ty: 0, tz: 0 });
      const ptr = useRef({ down: false, btn: -1, lx: 0, ly: 0, nodeId: null, dragged: false });
      const rcRef = useRef(null);
      const rafRef = useRef(null);
      const timePlaneMeshes = useRef({}); // dateStr -> THREE.Mesh
      const [timePlanes, setTimePlanes] = useState([]); // [{z, label, dateStr}]

      const ECOLS = { default:0x3a3a6a, imports:0x89ddff, calls:0x10b981, 'data-flow':0xffc410, inherits:0xbb9af7, test:0xff435a, dependency:0x3a3a6a, data:0xffc410, reference:0x8888ff };

      // Compute time epoch from nodes and build plane list
      const computeTimePlanes = useCallback((nodes) => {
        if (!nodes.length) return [];
        const timestamps = nodes.map(n=>n.createdAt||Date.now());
        const epoch = Math.min(...timestamps);
        const latest = Math.max(...timestamps);
        const DAY_MS = 24*60*60*1000;
        // Generate one plane per calendar day in range, plus "TODAY"
        const startDay = new Date(epoch); startDay.setHours(0,0,0,0);
        const endDay = new Date(latest+DAY_MS); endDay.setHours(0,0,0,0);
        const planes = [];
        let d = new Date(startDay);
        while (d <= endDay) {
          const ts = d.getTime();
          const z = timeToZ(ts, epoch);
          const isToday = new Date().toDateString() === d.toDateString();
          const label = isToday ? 'TODAY' : d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
          const dateStr = d.toISOString().slice(0,10);
          planes.push({ z, label, dateStr, ts, isToday });
          d = new Date(d.getTime() + DAY_MS);
        }
        return planes;
      }, []);

      useEffect(() => {
        const mount = mountRef.current;
        if (!mount || !window.THREE) return;
        const T = window.THREE;
        rcRef.current = new T.Raycaster();

        const scene = new T.Scene();
        const cam = new T.PerspectiveCamera(55, mount.clientWidth / mount.clientHeight, 1, 12000);
        const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(mount.clientWidth, mount.clientHeight);
        renderer.setClearColor(0x000000, 0);
        mount.appendChild(renderer.domElement);
        T3.current = { scene, cam, renderer };

        // Lights
        scene.add(new T.AmbientLight(0xffffff, 0.22));
        [[0x10b981,2.2,[400,400,400]],[0x4285f4,1.8,[-400,-300,200]],[0xbb9af7,1.4,[0,-400,-300]]].forEach(([c,i,p])=>{
          const l = new T.PointLight(c,i,1600); l.position.set(...p); scene.add(l);
        });

        // Starfield
        const sp = new Float32Array(3000*3);
        for(let i=0;i<sp.length;i++) sp[i]=(Math.random()-.5)*8000;
        const sg = new T.BufferGeometry(); sg.setAttribute('position', new T.BufferAttribute(sp,3));
        scene.add(new T.Points(sg, new T.PointsMaterial({ color:0xffffff, size:1.1, transparent:true, opacity:0.35 })));

        // Z-axis "time rail" — a thin line running through the centre along Z
        const axisGeo = new T.BufferGeometry().setFromPoints([
          new T.Vector3(0,-220,-1000), new T.Vector3(0,-220,1000)
        ]);
        scene.add(new T.Line(axisGeo, new T.LineBasicMaterial({ color:0x10b981, transparent:true, opacity:0.15 })));

        // Resize
        const onResize = () => {
          cam.aspect = mount.clientWidth / mount.clientHeight;
          cam.updateProjectionMatrix();
          renderer.setSize(mount.clientWidth, mount.clientHeight);
        };
        const ro = new ResizeObserver(onResize); ro.observe(mount);

        // Animation loop
        const animate = () => {
          rafRef.current = requestAnimationFrame(animate);
          const o = orbit.current;
          cam.position.set(
            o.tx + o.radius * Math.sin(o.phi) * Math.sin(o.theta),
            o.ty + o.radius * Math.cos(o.phi),
            o.tz + o.radius * Math.sin(o.phi) * Math.cos(o.theta)
          );
          cam.lookAt(o.tx, o.ty, o.tz);

          const nodes = nodesRef.current, edges = edgesRef.current;
          const seen = new Set(), eseen = new Set();

          // Recompute epoch each frame (handles new nodes)
          const epoch = nodes.length
            ? nodes.reduce((m,n)=>Math.min(m,n.createdAt||Date.now()),Date.now())
            : Date.now();

          // ── Time-plane slabs ────────────────────────────────────────────────
          const planes = computeTimePlanes(nodes);
          // Sync plane meshes
          const pseen = new Set();
          planes.forEach(pl => {
            pseen.add(pl.dateStr);
            if (!timePlaneMeshes.current[pl.dateStr]) {
              const geo = new T.PlaneGeometry(800, 500);
              const isToday = pl.isToday;
              const mat = new T.MeshBasicMaterial({
                color: isToday ? 0x10b981 : 0x4285f4,
                transparent: true, opacity: isToday ? 0.055 : 0.025,
                side: T.DoubleSide, depthWrite: false,
              });
              const mesh = new T.Mesh(geo, mat);
              mesh.rotation.x = Math.PI / 2; // lay flat in XY
              mesh.rotation.x = 0; mesh.rotation.y = 0; mesh.rotation.z = 0;
              // Stand vertically, face Z direction
              mesh.position.set(0, 0, pl.z);
              scene.add(mesh);
              timePlaneMeshes.current[pl.dateStr] = mesh;

              // Grid lines on the plane
              const gridHelper = new T.GridHelper(600, 8, isToday ? 0x10b981 : 0x2a3a5a, isToday ? 0x10b981 : 0x1a2040);
              gridHelper.rotation.x = Math.PI / 2;
              gridHelper.position.set(0, 0, pl.z);
              gridHelper.material.transparent = true;
              gridHelper.material.opacity = isToday ? 0.18 : 0.08;
              scene.add(gridHelper);
              timePlaneMeshes.current[pl.dateStr + '_grid'] = gridHelper;
            }
          });
          Object.keys(timePlaneMeshes.current).forEach(k => {
            const base = k.replace('_grid','');
            if (!pseen.has(base)) {
              scene.remove(timePlaneMeshes.current[k]);
              delete timePlaneMeshes.current[k];
            }
          });

          // ── Node meshes ─────────────────────────────────────────────────────
          nodes.forEach(n => {
            seen.add(n.id);
            const accent = AVATAR_ACCENTS[n.themeIdx % AVATAR_ACCENTS.length];
            if (!nodeMeshMap.current[n.id]) {
              const col = new T.Color(accent);
              const sphere = new T.Mesh(
                new T.SphereGeometry(16, 24, 24),
                new T.MeshPhongMaterial({ color: col, emissive: col.clone().multiplyScalar(0.28), shininess: 130 })
              );
              const halo = new T.Mesh(
                new T.SphereGeometry(27, 14, 14),
                new T.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.07, side: T.BackSide })
              );
              // Drop line to time plane
              const lineGeo = new T.BufferGeometry().setFromPoints([new T.Vector3(0,0,0), new T.Vector3(0,-180,0)]);
              const dropLine = new T.Line(lineGeo, new T.LineBasicMaterial({ color: new T.Color(accent), transparent:true, opacity: 0.18 }));
              const grp = new T.Group();
              grp.add(sphere, halo, dropLine);
              scene.add(grp);
              nodeMeshMap.current[n.id] = { grp, sphere, halo, dropLine, smat: sphere.material, hmat: halo.material, dmat: dropLine.material };
            }
            const { grp, sphere, smat, hmat, dmat } = nodeMeshMap.current[n.id];
            const nz = timeToZ(n.createdAt||Date.now(), epoch);
            grp.position.set(n.x, n.y, nz);
            smat.color.set(accent); smat.emissive.set(accent); smat.emissive.multiplyScalar(0.28);
            hmat.color.set(accent); dmat.color.set(accent);
            const st = nodeExecStatus[n.id];
            const isHov = hoveredNodeId === n.id, isJoin = joinFirstNode === n.id;
            if (st==='running') { smat.emissive.setHex(0xffc410); smat.emissiveIntensity=0.9; hmat.color.setHex(0xffc410); hmat.opacity=0.2; }
            else if (st==='success') { smat.emissive.setHex(0x10b981); smat.emissiveIntensity=0.7; hmat.opacity=0.1; }
            else if (st==='error') { smat.emissive.setHex(0xff435a); smat.emissiveIntensity=0.8; hmat.color.setHex(0xff435a); hmat.opacity=0.18; }
            else { smat.emissiveIntensity=0.28; hmat.opacity=0.07; }
            if (isHov||isJoin) { smat.emissiveIntensity=Math.max(smat.emissiveIntensity,0.6); hmat.opacity=Math.max(hmat.opacity,0.2); }
            sphere.scale.setScalar(isHov ? 1.35 : isJoin ? 1.2 : n.isMain ? 1.18 : 1.0);
            grp.rotation.y += 0.004;
          });
          Object.keys(nodeMeshMap.current).forEach(id => {
            if (!seen.has(id)) { scene.remove(nodeMeshMap.current[id].grp); delete nodeMeshMap.current[id]; }
          });

          // ── Edge lines ──────────────────────────────────────────────────────
          edges.forEach(e => {
            const src = nodes.find(n=>n.id===e.source), tgt = nodes.find(n=>n.id===e.target);
            if (!src||!tgt) return;
            eseen.add(e.id);
            const sz = timeToZ(src.createdAt||Date.now(), epoch);
            const tz2 = timeToZ(tgt.createdAt||Date.now(), epoch);
            const pts = [new T.Vector3(src.x,src.y,sz), new T.Vector3(tgt.x,tgt.y,tz2)];
            const et = e.edgeType||'default', col = ECOLS[et]??ECOLS.default;
            const isErr = nodeExecStatus[src.id]==='error' && (et==='calls'||et==='data-flow');
            const isHovEdge = hoveredEdgeId===e.id && edgeMode==='cut';
            // Cross-time edges get a dashed "time-travel" look
            const isTimeEdge = Math.abs(sz - tz2) > 20;
            if (!edgeLineMap.current[e.id]) {
              const geo = new T.BufferGeometry().setFromPoints(pts);
              const mat = new T.LineBasicMaterial({ color: isErr?0xff435a:col, transparent:true, opacity: isTimeEdge ? 0.5 : 0.75 });
              const line = new T.Line(geo, mat); scene.add(line);
              edgeLineMap.current[e.id] = line;
            } else {
              edgeLineMap.current[e.id].geometry.setFromPoints(pts);
              edgeLineMap.current[e.id].material.color.setHex(isHovEdge?0xff435a:isErr?0xff435a:col);
              edgeLineMap.current[e.id].material.opacity = isHovEdge ? 1.0 : isTimeEdge ? 0.5 : 0.75;
            }
          });
          Object.keys(edgeLineMap.current).forEach(id => {
            if (!eseen.has(id)) { scene.remove(edgeLineMap.current[id]); delete edgeLineMap.current[id]; }
          });

          renderer.render(scene, cam);

          // ── HTML label positions ────────────────────────────────────────────
          const w = mount.clientWidth, h = mount.clientHeight;
          if (labelContainerRef.current) {
            nodes.forEach(n => {
              const el = labelRefs.current[n.id];
              if (!el) return;
              const nz = timeToZ(n.createdAt||Date.now(), epoch);
              const v = new T.Vector3(n.x, n.y, nz).project(cam);
              if (v.z > 1) { el.style.display='none'; return; }
              el.style.display='';
              el.style.left = ((v.x*0.5+0.5)*w)+'px';
              el.style.top  = ((-v.y*0.5+0.5)*h+23)+'px';
            });
          }
          // ── Time plane date labels ──────────────────────────────────────────
          if (timeLabelContainerRef.current) {
            planes.forEach(pl => {
              const el = timeLabelRefs.current[pl.dateStr];
              if (!el) return;
              const v = new T.Vector3(-280, 0, pl.z).project(cam);
              if (v.z > 1) { el.style.display='none'; return; }
              el.style.display='';
              el.style.left = ((v.x*0.5+0.5)*w)+'px';
              el.style.top  = ((-v.y*0.5+0.5)*h)+'px';
            });
          }
        };
        animate();

        return () => {
          cancelAnimationFrame(rafRef.current);
          ro.disconnect();
          renderer.dispose();
          if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
          Object.values(nodeMeshMap.current).forEach(({grp})=>scene.remove(grp));
          Object.values(edgeLineMap.current).forEach(l=>scene.remove(l));
          Object.values(timePlaneMeshes.current).forEach(m=>scene.remove(m));
          nodeMeshMap.current={}; edgeLineMap.current={}; timePlaneMeshes.current={};
        };
      }, []);

      // Raycast helper
      const raycastNodes = useCallback((ex, ey) => {
        const T = window.THREE, rc = rcRef.current, cam = T3.current.cam, mount = mountRef.current;
        if (!T || !rc || !cam || !mount) return null;
        const rect = mount.getBoundingClientRect();
        const ndcX = ((ex-rect.left)/rect.width)*2-1, ndcY = -((ey-rect.top)/rect.height)*2+1;
        rc.setFromCamera({x:ndcX, y:ndcY}, cam);
        const meshes = Object.entries(nodeMeshMap.current).map(([id,{sphere}])=>({id,mesh:sphere}));
        const hits = rc.intersectObjects(meshes.map(m=>m.mesh));
        if (!hits.length) return null;
        return meshes.find(m=>m.mesh===hits[0].object)?.id || null;
      }, []);

      const onPointerDown = useCallback((e) => {
        if (e.target.closest('.g3d-lbl,.floating-panel,.graph-mode-bar')) return;
        e.currentTarget.setPointerCapture(e.pointerId);
        ptr.current = { down:true, btn:e.button, lx:e.clientX, ly:e.clientY, nodeId:null, dragged:false };
        if (e.button===0) {
          const nid = raycastNodes(e.clientX, e.clientY);
          if (nid) ptr.current.nodeId = nid;
        }
      }, [raycastNodes]);

      const onPointerMove = useCallback((e) => {
        const dx = e.clientX - ptr.current.lx, dy = e.clientY - ptr.current.ly;
        if (!ptr.current.down) {
          // Hover
          const nid = raycastNodes(e.clientX, e.clientY);
          setHoveredNodeId(nid);
          return;
        }
        if (Math.abs(dx)>1||Math.abs(dy)>1) ptr.current.dragged = true;

        if (ptr.current.nodeId && ptr.current.btn===0 && !edgeMode) {
          const T = window.THREE, rc = rcRef.current, cam = T3.current.cam, mount = mountRef.current;
          const rect = mount.getBoundingClientRect();
          const ndcX = ((e.clientX-rect.left)/rect.width)*2-1, ndcY = -((e.clientY-rect.top)/rect.height)*2+1;
          rc.setFromCamera({x:ndcX,y:ndcY},cam);
          const node = nodesRef.current.find(n=>n.id===ptr.current.nodeId);
          if (node) {
            // Drag only in XY — Z is locked to createdAt (time is immutable)
            const epoch = nodesRef.current.reduce((m,n)=>Math.min(m,n.createdAt||Date.now()),Date.now());
            const nz = timeToZ(node.createdAt||Date.now(), epoch);
            const plane = new T.Plane(new T.Vector3(0,0,1), -nz);
            const hit = new T.Vector3();
            if (rc.ray.intersectPlane(plane, hit)) { node.x=hit.x; node.y=hit.y; node.vx=0; node.vy=0; }
          }
        } else if (!ptr.current.nodeId) {
          if (ptr.current.btn===0) {
            // Orbit
            orbit.current.theta -= dx * 0.007;
            orbit.current.phi = Math.max(0.08, Math.min(Math.PI-0.08, orbit.current.phi - dy * 0.007));
          } else if (ptr.current.btn===2||ptr.current.btn===1) {
            // Pan — move target in camera-right and camera-up
            const T = window.THREE, cam = T3.current.cam;
            const right = new T.Vector3(); cam.getWorldDirection(new T.Vector3()).cross(new T.Vector3(0,1,0)).normalize();
            orbit.current.tx -= dx * 0.55;
            orbit.current.ty += dy * 0.55;
          }
        }
        ptr.current.lx = e.clientX; ptr.current.ly = e.clientY;
      }, [edgeMode, raycastNodes, nodesRef]);

      const onPointerUp = useCallback((e) => {
        if (!ptr.current.dragged && ptr.current.btn===0) {
          const nid = ptr.current.nodeId || raycastNodes(e.clientX, e.clientY);
          if (nid) {
            if (edgeMode==='join') handleNodeClickInMode(nid);
            else if (!edgeMode) openNodeInEditor(nid);
          }
        }
        if (ptr.current.nodeId && ptr.current.dragged) {
          const node = nodesRef.current.find(n=>n.id===ptr.current.nodeId);
          if (node && socketRef.current?.connected) {
            socketRef.current.emit('node:edit', {
              workspaceId, nodeId:node.id, position:{x:node.x,y:node.y},
              operatorId, sessionId:sessionIdRef.current,
              clientEventId:`pos-${Date.now()}`,
            });
          }
        }
        ptr.current.down = false; ptr.current.nodeId = null;
      }, [edgeMode, raycastNodes, handleNodeClickInMode, openNodeInEditor, nodesRef]);

      const onWheel = useCallback((e) => {
        if (e.target.closest('.floating-panel')) return;
        e.preventDefault();
        orbit.current.radius = Math.max(80, Math.min(3500, orbit.current.radius * (e.deltaY>0?1.09:0.92)));
      }, []);

      const nodes = nodesRef.current;

      return (
        <div style={{position:'relative',flex:1,overflow:'hidden'}}
          onPointerDown={onPointerDown} onPointerMove={onPointerMove}
          onPointerUp={onPointerUp}
          onPointerLeave={()=>{ptr.current.down=false;ptr.current.nodeId=null;setHoveredNodeId(null);}}
          onWheel={onWheel} onContextMenu={e=>e.preventDefault()}>

          {/* Three.js canvas mount */}
          <div ref={mountRef} style={{position:'absolute',inset:0}}/>

          {/* HTML label overlay — positions updated imperatively in RAF */}
          <div ref={labelContainerRef} style={{position:'absolute',inset:0,pointerEvents:'none'}}>
            {nodes.map(n => {
              const accent = AVATAR_ACCENTS[n.themeIdx % AVATAR_ACCENTS.length];
              const st = nodeExecStatus[n.id];
              const nodePeers = Object.values(peers).filter(p=>p.nodeId===n.id);
              const dateStr = n.createdAt ? new Date(n.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}) : '';
              return (
                <div key={n.id} className="g3d-lbl" ref={el=>{if(el)labelRefs.current[n.id]=el;else delete labelRefs.current[n.id];}}
                  style={{position:'absolute',transform:'translateX(-50%)',pointerEvents:'auto',zIndex:5,cursor:'pointer',userSelect:'none'}}>
                  <div style={{background:'rgba(6,6,18,0.9)',border:`1px solid ${accent}55`,borderRadius:'4px',padding:'2px 8px',
                    fontSize:'9px',color:accent,fontFamily:"'JetBrains Mono',monospace",letterSpacing:'0.5px',whiteSpace:'nowrap',
                    display:'flex',alignItems:'center',gap:'5px',boxShadow:`0 0 14px ${accent}22`}}>
                    <span style={{width:'6px',height:'6px',borderRadius:'50%',background:accent,flexShrink:0,boxShadow:`0 0 6px ${accent}`}}/>
                    <span onClick={e=>{e.stopPropagation();if(edgeMode==='join')handleNodeClickInMode(n.id);else openNodeInEditor(n.id);}}>
                      {n.label}{n.modified&&<span style={{color:'#ffc410',marginLeft:'3px'}}>●</span>}
                    </span>
                    {st==='running'&&<span style={{color:'#ffc410',animation:'pulse 0.8s infinite',fontSize:'8px'}}>▶</span>}
                    {st==='success'&&<span style={{color:'#10b981',fontSize:'8px'}}>✓</span>}
                    {st==='error'&&<span style={{color:'#ff435a',fontSize:'8px'}}>✗</span>}
                    <span style={{opacity:0.4,fontSize:'8px',cursor:'pointer'}} onPointerDown={e=>e.stopPropagation()}
                      onClick={e=>{e.stopPropagation();runNode(n.id);}}>▶</span>
                    <span style={{opacity:0.3,fontSize:'8px',cursor:'pointer'}} onPointerDown={e=>e.stopPropagation()}
                      onClick={e=>{e.stopPropagation();const rect=e.currentTarget.getBoundingClientRect();setNodeColorPicker({nodeId:n.id,x:rect.left,y:rect.bottom+6});}}>●</span>
                  </div>
                  {dateStr && <div style={{fontSize:'7px',opacity:0.3,fontFamily:"'JetBrains Mono',monospace",textAlign:'center',marginTop:'1px',letterSpacing:'0.3px',color:'rgba(255,255,255,0.4)'}}>{dateStr}</div>}
                  {nodePeers.length>0&&(
                    <div style={{display:'flex',justifyContent:'center',gap:'-2px',marginTop:'2px',pointerEvents:'none'}}>
                      {nodePeers.slice(0,3).map((p,i)=>(
                        <div key={i} title={p.name} style={{width:'12px',height:'12px',borderRadius:'50%',background:p.color||'#10b981',border:'1.5px solid rgba(8,8,16,0.9)',marginLeft:i>0?'-4px':'0',fontSize:'6px',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'bold',boxShadow:`0 0 5px ${p.color||'#10b981'}88`}}>
                          {(p.name||'?')[0].toUpperCase()}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Time-plane date labels — positioned imperatively in RAF */}
          <div ref={timeLabelContainerRef} style={{position:'absolute',inset:0,pointerEvents:'none'}}>
            {computeTimePlanes(nodes).map(pl => (
              <div key={pl.dateStr} ref={el=>{if(el)timeLabelRefs.current[pl.dateStr]=el;else delete timeLabelRefs.current[pl.dateStr];}}
                style={{position:'absolute',transform:'translate(-50%,-50%)',whiteSpace:'nowrap'}}>
                <div style={{
                  fontSize:'9px',fontFamily:"'JetBrains Mono',monospace",letterSpacing:'2px',

                  borderRadius:'3px',padding:'2px 8px',
                  textShadow: pl.isToday ? '0 0 12px #10b981' : 'none',

                  {pl.label}
                </div>
              </div>
            ))}
          </div>

          {/* Empty state */}
          {nodes.length===0&&(
            <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',pointerEvents:'none',zIndex:2}}>
              <div style={{textAlign:'center',opacity:0.08,userSelect:'none'}}>
                <div style={{fontSize:'80px',fontFamily:"'JetBrains Mono',monospace",lineHeight:1}}>⬡</div>
                <div style={{fontSize:'13px',letterSpacing:'5px',marginTop:'14px',fontFamily:"'JetBrains Mono',monospace",fontWeight:900}}>FORBIDDEN</div>
                <div style={{fontSize:'9px',letterSpacing:'2.5px',marginTop:'5px',opacity:0.7}}>EMPTY WORKSPACE</div>
              </div>
              <div style={{marginTop:'32px',display:'flex',flexDirection:'column',alignItems:'center',gap:'7px',opacity:0.15,pointerEvents:'auto'}}>
                <button className="btn hdr-pill" onClick={()=>setShowCreateNode(true)} style={{fontSize:'9px',letterSpacing:'1.5px'}}>＋ CREATE FIRST NODE</button>
                <div style={{fontSize:'8px',opacity:0.7,letterSpacing:'1px',fontFamily:"'JetBrains Mono',monospace"}}>OR PRESS N</div>
              </div>
            </div>
          )}

          {/* Controls hint */}
          <div style={{position:'absolute',bottom:'12px',left:'50%',transform:'translateX(-50%)',zIndex:10,display:'flex',gap:'8px',alignItems:'center'}}>
            <div style={{background:'rgba(6,6,18,0.7)',border:'1px solid rgba(255,255,255,0.06)',borderRadius:'6px',padding:'4px 14px',fontSize:'8px',opacity:0.4,letterSpacing:'1px',fontFamily:"'JetBrains Mono',monospace",pointerEvents:'none',whiteSpace:'nowrap'}}>

              onClick={()=>{ orbit.current={theta:0.55,phi:1.05,radius:820,tx:0,ty:0,tz:0}; }}>
              ⌖ RESET
            </button>
            <button style={{padding:'4px 10px',background:'rgba(6,6,18,0.85)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'4px',color:'rgba(255,255,255,0.35)',fontSize:'8px',cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",letterSpacing:'1px'}}
              onClick={()=>{ orbit.current.phi=0.12; orbit.current.theta=0; orbit.current.radius=900; }}>
              ↑ TOP
            </button>
            <button style={{padding:'4px 10px',background:'rgba(6,6,18,0.85)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'4px',color:'rgba(16,185,129,0.5)',fontSize:'8px',cursor:'pointer',fontFamily:"'JetBrains Mono',monospace",letterSpacing:'1px',borderColor:'rgba(16,185,129,0.2)'}}
              onClick={()=>{ orbit.current.theta=Math.PI/2; orbit.current.phi=Math.PI/2; orbit.current.radius=900; }}>
              ⟶ TIMELINE
            </button>
          </div>
        </div>
      );
    }

    // ── Phase 6.2: Read-only Share View ──────────────────────────────────────
    function ShareView({ shareToken }) {
      const [data, setData] = useState(null);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch(`${API_URL}/share/${shareToken}`)
          .then(r => r.ok ? r.json() : Promise.reject(r.statusText))
          .then(d => { setData(d); setLoading(false); })
          .catch(e => { setError(String(e)); setLoading(false); });
      }, [shareToken]);

      if (loading) return (
        <div style={{width:'100vw',height:'100vh',background:'#050505',display:'flex',alignItems:'center',justifyContent:'center',color:'rgba(255,255,255,0.2)',fontFamily:"'JetBrains Mono',monospace",letterSpacing:'3px',fontSize:'11px'}}>
          LOADING SNAPSHOT...
        </div>
      );
      if (error || !data) return (
        <div style={{width:'100vw',height:'100vh',background:'#050505',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:'#ff435a',fontFamily:"'JetBrains Mono',monospace',gap:'12px"}}>
          <div style={{fontSize:'40px',opacity:0.3}}>⚠</div>
          <div style={{letterSpacing:'2px',fontSize:'11px'}}>SHARE LINK EXPIRED OR INVALID</div>
          <div style={{fontSize:'9px',opacity:0.3,marginTop:'4px'}}>{error}</div>
        </div>
      );

      const nodes = data.nodes || [];
      const edges = nodes.flatMap(n => (n.edges||[]).map(e => ({ id:`${n.id}-${e.targetId}`, source:n.id, target:e.targetId, edgeType:e.edgeType||'default' })));
      const [activeId, setActiveId] = useState(null);
      const activeNode = nodes.find(n => n.id === activeId);

      return (
        <div style={{width:'100vw',height:'100vh',background:'#080810',color:'#9494b0',fontFamily:"'JetBrains Mono',monospace",display:'flex',flexDirection:'column',overflow:'hidden'}}>
          {/* Header */}
          <div style={{display:'flex',alignItems:'center',gap:'16px',padding:'10px 20px',borderBottom:'1px solid rgba(255,255,255,0.06)',background:'rgba(0,0,0,0.3)',flexShrink:0}}>
            <div style={{fontSize:'13px',fontWeight:900,letterSpacing:'4px',color:'rgba(255,255,255,0.8)'}}>FORBIDDEN</div>
            <div style={{width:'1px',height:'16px',background:'rgba(255,255,255,0.1)'}}/>
            <div style={{fontSize:'9px',opacity:0.35,letterSpacing:'2px'}}>{data.snapshot?.workspaceId || 'SNAPSHOT'}</div>
            <div style={{padding:'2px 10px',background:'rgba(255,67,90,0.1)',border:'1px solid rgba(255,67,90,0.3)',borderRadius:'20px',fontSize:'8px',color:'#ff435a',letterSpacing:'1px'}}>READ ONLY</div>
            <div style={{fontSize:'8px',opacity:0.2,marginLeft:'auto',letterSpacing:'1px'}}>Expires: {data.expiresAt ? new Date(data.expiresAt).toLocaleString() : '24h'}</div>
          </div>
          {/* Body */}
          <div style={{flex:1,display:'flex',overflow:'hidden'}}>
            {/* Graph canvas */}
            <div style={{flex:1,position:'relative',overflow:'hidden'}}>
              <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none'}}>
                <defs>
                  {['default','imports','calls','data-flow','inherits','test'].map(t => (
                    <marker key={t} id={`sh-arrow-${t}`} markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                      <path d="M0,0 L0,6 L8,3 z" fill={{default:'rgba(255,255,255,0.25)',imports:'#89ddff',calls:'#10b981','data-flow':'#ffc410',inherits:'#bb9af7',test:'#ff435a'}[t]||'rgba(255,255,255,0.25)'}/>
                    </marker>
                  ))}
                </defs>
                {edges.map(e => {
                  const s = nodes.find(n=>n.id===e.source), t = nodes.find(n=>n.id===e.target);
                  if (!s||!t) return null;
                  const mx=(s.position?.x||0+t.position?.x||0)/2, my=(s.position?.y||0+t.position?.y||0)/2-20;
                  const COLORS = {default:'rgba(255,255,255,0.18)',imports:'#89ddff',calls:'#10b981','data-flow':'#ffc410',inherits:'#bb9af7',test:'#ff435a'};
                  return (
                    <path key={e.id} d={`M${s.position?.x||0} ${s.position?.y||0} Q${mx} ${my} ${t.position?.x||0} ${t.position?.y||0}`}
                      fill="none" stroke={COLORS[e.edgeType]||COLORS.default} strokeWidth="1.5" opacity="0.7"
                      markerEnd={e.edgeType!=='default'?`url(#sh-arrow-${e.edgeType})`:undefined}/>
                  );
                })}
              </svg>
              <div style={{position:'absolute',inset:0}}>
                {nodes.map(n => {
                  const accent = AVATAR_ACCENTS[((n.themeIdx||0))%AVATAR_ACCENTS.length];
                  const x = n.position?.x || (Math.random()-0.5)*400 + 400;
                  const y = n.position?.y || (Math.random()-0.5)*300 + 300;
                  return (
                    <div key={n.id} style={{position:'absolute',left:x+'px',top:y+'px',transform:'translate(-50%,-50%)',cursor:'pointer',zIndex:10}}
                      onClick={()=>setActiveId(id=>id===n.id?null:n.id)}>
                      <div style={{width:'40px',height:'40px',borderRadius:'50%',background:'#080810',border:`2px solid ${accent}`,boxShadow:`0 0 12px ${accent}66`,display:'flex',alignItems:'center',justifyContent:'center',transition:'transform 0.15s',transform:activeId===n.id?'scale(1.3)':'scale(1)'}}>
                        <span style={{fontSize:'10px',opacity:0.6}}>{n.type==='class'?'C':n.type==='test'?'T':'ƒ'}</span>
                      </div>
                      <div style={{position:'absolute',top:'44px',left:'50%',transform:'translateX(-50%)',whiteSpace:'nowrap',fontSize:'9px',color:accent,background:'rgba(8,8,16,0.85)',padding:'2px 6px',borderRadius:'3px',border:`1px solid ${accent}33`,pointerEvents:'none'}}>{n.label}</div>
                    </div>
                  );
                })}
              </div>
            </div>
            {/* Code panel */}
            {activeNode && (
              <div style={{width:'400px',flexShrink:0,borderLeft:'1px solid rgba(255,255,255,0.06)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
                <div style={{padding:'10px 14px',borderBottom:'1px solid rgba(255,255,255,0.06)',fontSize:'10px',display:'flex',gap:'8px',alignItems:'center',flexShrink:0}}>
                  <div style={{width:'8px',height:'8px',borderRadius:'50%',background:AVATAR_ACCENTS[(activeNode.themeIdx||0)%AVATAR_ACCENTS.length],boxShadow:`0 0 6px ${AVATAR_ACCENTS[(activeNode.themeIdx||0)%AVATAR_ACCENTS.length]}`}}/>
                  <span style={{opacity:0.8}}>{activeNode.label}</span>
                  <span style={{opacity:0.3,fontSize:'9px',marginLeft:'auto'}}>{activeNode.type}</span>
                </div>
                <pre style={{flex:1,margin:0,padding:'14px',overflow:'auto',fontSize:'11px',fontFamily:"'JetBrains Mono',monospace",lineHeight:'1.7',color:'rgba(200,220,200,0.8)',background:'#040408',whiteSpace:'pre-wrap',wordBreak:'break-all',userSelect:'text'}}>{activeNode.code||'(empty)'}</pre>
              </div>
            )}
          </div>
          {/* Footer */}
          <div style={{padding:'6px 20px',borderTop:'1px solid rgba(255,255,255,0.04)',fontSize:'8px',opacity:0.2,letterSpacing:'1px',display:'flex',gap:'20px',flexShrink:0}}>
            <span>{nodes.length} nodes</span>
            <span>{edges.length} edges</span>
            <span style={{marginLeft:'auto'}}>FORBIDDEN — Read-Only Share</span>
          </div>
        </div>
      );
    }

    function Bootloader() {
      const [step, setStep] = useState(() => {
        // Phase 1.1 — Restore session on reload
        try {
          const saved = sessionStorage.getItem('forbidden:session');
          if (saved) {
            const s = JSON.parse(saved);
            if (s.token && s.workspaceId) return 'ide';
          }
        } catch {}
        return 'identity';
      });
      const [theme, setTheme] = useState(() => {
        try { return sessionStorage.getItem('forbidden:theme') || null; } catch { return null; }
      });
      const [avatar, setAvatar] = useState(() => {
        try { const v = sessionStorage.getItem('forbidden:avatar'); return v !== null ? Number(v) : null; } catch { return null; }
      });
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const [token, setToken] = useState(() => {
        try { return JSON.parse(sessionStorage.getItem('forbidden:session') || 'null')?.token || null; } catch { return null; }
      });
      const [operatorId, setOperatorId] = useState(() => {
        try { return JSON.parse(sessionStorage.getItem('forbidden:session') || 'null')?.operatorId || ''; } catch { return ''; }
      });
      const [operatorName, setOperatorName] = useState(() => {
        try { return JSON.parse(sessionStorage.getItem('forbidden:session') || 'null')?.operatorName || ''; } catch { return ''; }
      });
      const [workspaceId, setWorkspaceId] = useState(() => {
        try { return JSON.parse(sessionStorage.getItem('forbidden:session') || 'null')?.workspaceId || ''; } catch { return ''; }
      });
      const [workspaceName, setWorkspaceName] = useState(() => {
        try { return JSON.parse(sessionStorage.getItem('forbidden:session') || 'null')?.workspaceName || ''; } catch { return ''; }
      });

      const saveSession = (tok, opId, opName, wsId, wsName) => {
        try { sessionStorage.setItem('forbidden:session', JSON.stringify({ token: tok, operatorId: opId, operatorName: opName, workspaceId: wsId, workspaceName: wsName })); } catch {}
      };

      const handleThemeSelect = (t) => {
        setTheme(t);
        try { sessionStorage.setItem('forbidden:theme', t); } catch {}
        if (avatar !== null) setStep('credentials');
      };
      const handleAvatarSelect = (i) => {
        setAvatar(i);
        try { sessionStorage.setItem('forbidden:avatar', String(i)); } catch {}
      };

      const handleLogin = async () => {
        if (!username.trim() || !password.trim()) return;
        setAuthLoading(true); setAuthError('');
        try {
          const data = await apiFetch('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ username: username.trim(), password }),
          });
          setToken(data.token);
          setOperatorId(data.operator?.id || data.operator?.sub || data.userId || username);
          setOperatorName(data.operator?.name || data.operator?.login || username);
          setStep('workspace');
        } catch (e) {
          setAuthError(e.status === 401 ? 'Invalid credentials' : e.message);
        } finally { setAuthLoading(false); }
      };

      const handleDemoMode = () => {
        setToken('DEMO'); setOperatorId('demo'); setOperatorName('OPERATOR');
        setWorkspaceId('demo'); setWorkspaceName('Demo Workspace'); setStep('ide');
      };

      const handleLogout = () => {
        try { sessionStorage.removeItem('forbidden:session'); } catch {}
        setToken(null); setWorkspaceId(''); setWorkspaceName(''); setStep('identity');
      };

      if (step === 'ide') {
        return <IDEWithCmd initialTheme={theme || 'cyber'} initialAvatar={avatar || 0}
          token={token === 'DEMO' ? null : token}
          operatorId={operatorId} operatorName={operatorName}
          workspaceId={workspaceId} workspaceName={workspaceName}
          onLogout={handleLogout}/>;
      }

      if (step === 'workspace' && token) {
        return <WorkspacePicker token={token} operatorId={operatorId} operatorName={operatorName}
          avatar={avatar} theme={theme}
          onSelect={(wsId, wsName) => {
            setWorkspaceId(wsId); setWorkspaceName(wsName); setStep('ide');
            saveSession(token, operatorId, operatorName, wsId, wsName);
          }}/>;
      }

      return (
        <div className="login-container">
          <div className="login-box">
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:'10px',opacity:0.25,letterSpacing:'4px',marginBottom:'14px',fontFamily:"'JetBrains Mono',monospace"}}>SYSTEM BOOT SEQUENCE</div>
              <h1 className="boot-title" style={{fontSize:'34px',fontWeight:900,letterSpacing:'6px',fontFamily:"'JetBrains Mono',monospace",marginBottom:'6px'}}>FORBIDDEN</h1>
              <div style={{fontSize:'10px',opacity:0.2,letterSpacing:'3px'}}>DUAL THEME GRAPH IDE</div>
            </div>

            {/* Step 1: Avatar */}
            <div className="boot-section" style={{animationDelay:'0.2s',opacity:0,background:'rgba(255,255,255,0.02)',padding:'28px',borderRadius:'6px',border:'1px solid rgba(255,255,255,0.06)'}}>
              <div style={{fontSize:'9px',opacity:0.35,marginBottom:'20px',textAlign:'center',letterSpacing:'3px'}}>01 // SELECT OPERATOR IDENTITY</div>
              <div style={{display:'flex',gap:'14px',justifyContent:'center',flexWrap:'wrap'}}>
                {[0,1,2,3,4,5].map(i=>(
                  <div key={i} onClick={()=>handleAvatarSelect(i)} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'7px',cursor:'pointer',transition:'transform 0.2s',transform:avatar===i?'translateY(-4px)':'none'}}>
                    <CyberAvatar index={i} size={68} selected={avatar===i}/>
                    <div style={{fontSize:'8px',letterSpacing:'1px',opacity:avatar===i?1:0.25,color:AVATAR_ACCENTS[i],fontFamily:"'JetBrains Mono',monospace",transition:'opacity 0.2s'}}>{AVATAR_NAMES[i]}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Step 2: Theme */}
            <div style={{opacity:avatar!==null?1:0.15,transition:'opacity 0.4s',pointerEvents:avatar!==null?'auto':'none'}}>
              <div style={{fontSize:'9px',opacity:0.35,marginBottom:'14px',textAlign:'center',letterSpacing:'3px'}}>02 // INITIALIZE ENGINE</div>
              <div style={{display:'flex',gap:'16px'}}>
                <button className="theme-btn cyber" disabled={avatar===null} onClick={()=>handleThemeSelect('cyber')}>
                  <div style={{fontSize:'20px',fontWeight:'bold',marginBottom:'6px',letterSpacing:'2px'}}>OBSIDIAN</div>
                  <div style={{fontSize:'9px',opacity:0.5,letterSpacing:'1px'}}>DARK / CYBERPUNK</div>
                </button>
                <button className="theme-btn brutal" disabled={avatar===null} onClick={()=>handleThemeSelect('brutal')}>
                  <div style={{fontSize:'20px',fontWeight:900,marginBottom:'6px',letterSpacing:'2px'}}>FORSAKEN</div>
                  <div style={{fontSize:'9px',opacity:0.6,fontWeight:'bold',letterSpacing:'1px'}}>LIGHT / BRUTALIST</div>
                </button>
              </div>
            </div>

            {/* Step 3: Credentials — appears after theme is chosen */}
            {step === 'credentials' && (
              <div style={{borderTop:'1px solid rgba(255,255,255,0.06)',paddingTop:'20px',display:'flex',flexDirection:'column',gap:'10px'}}>
                <div style={{fontSize:'9px',opacity:0.35,textAlign:'center',letterSpacing:'3px',marginBottom:'4px'}}>03 // AUTHENTICATE</div>
                <input className="login-input" placeholder="username" value={username}
                  onChange={e=>setUsername(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()}
                  autoFocus/>
                <input className="login-input" type="password" placeholder="password" value={password}
                  onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()}/>
                {authError && <div style={{color:'#ff435a',fontSize:'10px',opacity:0.8}}>{authError}</div>}
                <div style={{display:'flex',gap:'8px'}}>
                  <button className={`theme-btn ${theme}`} style={{flex:1}}
                    disabled={!username.trim()||!password.trim()||authLoading} onClick={handleLogin}>
                    {authLoading ? 'CONNECTING...' : 'CONNECT'}
                  </button>
                  <button onClick={handleDemoMode}
                    style={{padding:'10px 14px',border:'1px solid rgba(255,255,255,0.1)',background:'transparent',color:'rgba(255,255,255,0.3)',cursor:'pointer',borderRadius:'4px',fontSize:'9px',letterSpacing:'1px',transition:'all 0.2s'}}
                    onMouseEnter={e=>{e.target.style.color='rgba(255,255,255,0.6)';e.target.style.borderColor='rgba(255,255,255,0.25)';}}
                    onMouseLeave={e=>{e.target.style.color='rgba(255,255,255,0.3)';e.target.style.borderColor='rgba(255,255,255,0.1)';}}>
                    DEMO
                  </button>
                </div>
                <div style={{textAlign:'center',fontSize:'9px',opacity:0.2,letterSpacing:'1px'}}>
                  No backend? Click DEMO to run offline.
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    // Phase 6.2 — share link routing: ?share=TOKEN renders read-only view
    const urlParams = new URLSearchParams(window.location.search);
    const shareToken = urlParams.get('share');
    root.render(shareToken ? <ShareView shareToken={shareToken}/> : <Bootloader/>);
  </script>
</body>
</html>
